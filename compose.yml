services:
  postgres:
    image: postgres:17
    container_name: soflott-postgres
    environment:
      POSTGRES_DB: soflott_db
      POSTGRES_USER: soflott_app
      POSTGRES_PASSWORD: SoFlottApp_Local_ChangeMe!
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soflott_app -d soflott_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - soflott_postgres_data:/var/lib/postgresql/data

volumes:
  soflott_postgres_data:
