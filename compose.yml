services:
  mysql:
    image: mysql:8.4
    container_name: soflott-mysql
    environment:
      MYSQL_DATABASE: soflott_db
      MYSQL_USER: soflott_app
      MYSQL_PASSWORD: SoFlottApp_Local_ChangeMe!
      MYSQL_ROOT_PASSWORD: Root_Local_ChangeMe!
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pRoot_Local_ChangeMe!"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - soflott_mysql_data:/var/lib/mysql

volumes:
  soflott_mysql_data:
