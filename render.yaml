services:
  - type: web
    name: soflott-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__Postgres
        fromDatabase:
          name: soflott-db
          property: connectionString
      - key: Jwt__SigningKey
        generateValue: true
      - key: Cors__AllowedOrigins__0
        sync: false
      - key: Email__FrontendBaseUrl
        sync: false
      - key: Email__Enabled
        value: "false"
      - key: Email__ApiKey
        sync: false
      - key: Email__From
        value: soFlott <info@soflott.de>
      - key: Email__ReplyTo
        value: info@soflott.de
      - key: Invoicing__Email
        value: rechnung@soflott.de
      - key: Routing__ApiKey
        sync: false

databases:
  - name: soflott-db
    databaseName: soflott_db
    user: soflott_app
